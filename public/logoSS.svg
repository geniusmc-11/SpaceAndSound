<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" fill="none">
  <defs>
    <!-- Máscara para mantener la ventana y las separaciones de la nave limpias -->
    <mask id="nave-recortes-circular">
      <rect x="-100" y="-100" width="200" height="200" fill="#FFFFFF" />
      <!-- Ventana transparente -->
      <circle cx="10" cy="0" r="6.5" fill="#000000" />
      <!-- Líneas de separación entre el cuerpo, cúpula y aletas -->
      <path d="M -12,-17 C -4,-15 6,-15 14,-15" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M -4,17 C -12,16 -20,15 -26,15" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <line x1="-34" y1="-8" x2="-34" y2="8" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Fondo circular negro con borde blanco minimalista -->
  <circle cx="200" cy="200" r="192" fill="#000000" stroke="#FFFFFF" stroke-width="4" />

  <!-- Triángulo 3D minimalista centrado en el círculo -->
  <g transform="translate(0, 14)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Borde exterior -->
    <polygon points="200,52 66,294 334,294" />
    
    <!-- Borde interior -->
    <polygon points="200,104 112,265 288,265" />
    
    <!-- Líneas de separación de profundidad 3D -->
    <line x1="200" y1="52" x2="200" y2="104" />
    <line x1="66" y1="294" x2="112" y2="265" />
    <line x1="334" y1="294" x2="288" y2="265" />
  </g>

  <!-- Nave caricaturesca minimalista rellena de blanco -->
  <g transform="translate(202, 224) rotate(-25) scale(0.75)" mask="url(#nave-recortes-circular)">
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <!-- Propulsor trasero -->
      <path d="M -34,-8 L -44,-11 C -48,-4 -48,4 -44,11 L -34,8 Z" />
      
      <!-- Aleta superior -->
      <path d="M -24,-14 C -36,-30 -46,-26 -40,-9 Z" />
      
      <!-- Aleta inferior -->
      <path d="M -4,17 C -14,36 -30,36 -26,15 Z" />
      
      <!-- Cúpula superior -->
      <path d="M -12,-17 C -12,-33 14,-33 14,-15 Z" />
      
      <!-- Cuerpo redondeado -->
      <path d="M -34,0 C -34,-23 8,-25 42,0 C 8,25 -34,23 -34,0 Z" />
    </g>
  </g>
</svg>